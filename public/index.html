<html lang="en"><head><meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--g:#1ed760;--p:#ff4fb6;--v:#7b3ff2;--gg:linear-gradient(135deg,#1ed760,#b8f45a);--gv:linear-gradient(135deg,#7b3ff2,#e04bff);--hd:'Bricolage Grotesque',sans-serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(110% 70% at 0% 0%,#1d0f45,transparent 55%),radial-gradient(100% 70% at 100% 100%,#40102f,transparent 55%),#07070b;background-attachment:fixed;color:#fff;font:500 16px Outfit,system-ui,sans-serif;min-height:100dvh;overflow-x:hidden}
#app{max-width:480px;margin:auto;padding:0 20px;position:relative;z-index:2}
h1,h2,h3,.d{font-family:var(--hd);font-weight:800;line-height:1.02;letter-spacing:-.035em}
#bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.au{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;animation:au 14s ease-in-out infinite alternate;translate:calc(var(--mx,0)*50px) calc(var(--my,0)*50px)}
@keyframes au{to{transform:translate(60px,-80px) scale(1.25) rotate(40deg)}}
.vin{position:absolute;width:520px;height:520px;border-radius:50%;right:-240px;top:14%;border:2px solid #ffffff14;background:repeating-radial-gradient(circle,transparent 0 14px,#ffffff0a 15px 16px);animation:spin 40s linear infinite}
.vin::after{content:'';position:absolute;inset:36%;border-radius:50%;background:var(--gg);opacity:.55}
@keyframes spin{to{transform:rotate(360deg)}}
.fl{position:absolute;bottom:-70px;opacity:.2;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-125vh) rotate(300deg)}}
.screen{min-height:100dvh;padding:max(28px,env(safe-area-inset-top)) 0 max(48px,calc(env(safe-area-inset-bottom) + 30px));display:flex;flex-direction:column;gap:16px;animation:in .55s cubic-bezier(.2,1.3,.4,1)}
@keyframes in{from{opacity:0;transform:translateY(30px) scale(.96)}}
.btn{font:700 16px var(--hd);letter-spacing:-.01em;border:0;border-radius:99px;padding:18px 24px;background:var(--gg);background-size:200% 100%;color:#04140a;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 12px 30px -12px #1ed760aa;transition:transform .25s cubic-bezier(.2,1.5,.4,1),box-shadow .25s,background-position .5s}
.btn.w{background:#fff;box-shadow:0 12px 30px -14px #fff8}.btn.k{background:#0a0a0a;color:#fff;box-shadow:0 12px 30px -12px #0008}.btn.gh{background:#ffffff12;color:#fff;box-shadow:none;border:1px solid #ffffff1f}
.btn:active{transform:scale(.93)}
input.t{width:100%;font:700 20px var(--hd);padding:17px 20px;border-radius:20px;border:2px solid #ffffff1f;background:#ffffff0d;color:#fff;outline:0;transition:.2s}
input.t:focus{border-color:var(--g);box-shadow:0 0 0 5px #1ed76030;background:#ffffff14}
.hint{font-size:14px;min-height:20px;color:#b5b5c3}.hint.ok{color:var(--g)}.hint.no{color:var(--p)}
.logo{font-size:clamp(48px,16vw,74px);background:linear-gradient(100deg,#fff,#c9ffe0 45%,#1ed760);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.logo span{display:inline-block;background:linear-gradient(135deg,#ff4fb6,#7b3ff2);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:wob 2.4s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-9deg) scale(1.15)}}
.mq{white-space:nowrap;overflow:hidden;margin:4px -20px}.mq div{display:inline-block;animation:mq 22s linear infinite;font:800 17px var(--hd);color:#ffffff40}
.mq b{color:var(--g);margin:0 10px}@keyframes mq{to{transform:translateX(-50%)}}
.tile{position:relative;overflow:hidden;border-radius:26px;padding:18px;color:#0a0a0a;display:flex;align-items:center;gap:14px;cursor:pointer;animation:in .5s both;box-shadow:0 12px 30px -16px #000;transition:transform .3s cubic-bezier(.2,1.5,.4,1),box-shadow .3s}
.tile::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#ffffff66 50%,transparent 70%);transform:translateX(-120%);transition:transform .8s}
.tile:active{transform:scale(.96)}.tile h3{font-size:20px}.tile small{font:500 14px Outfit;opacity:.72}.ar{margin-left:auto;font-size:22px;transition:transform .25s}
.ic,.av{width:52px;height:52px;border-radius:18px;background:#0a0a0a;color:#fff;display:grid;place-items:center;font:800 20px var(--hd);flex:none}.ic{font-size:26px}
.story{position:fixed;inset:0;z-index:5;color:#0a0a0a;overflow:hidden;animation:in .4s}
.story::before{content:'';position:absolute;inset:-20%;background:radial-gradient(circle at 25% 20%,#ffffff66,transparent 35%),radial-gradient(circle at 85% 85%,#ffffff40,transparent 35%);animation:au 9s ease-in-out infinite alternate}
.story::after{content:'';position:absolute;width:360px;height:360px;border-radius:50%;border:34px dotted #ffffff30;right:-150px;top:22%;animation:spin 30s linear infinite}
.story .in{position:relative;z-index:1;max-width:480px;margin:auto;height:100%;padding:max(18px,env(safe-area-inset-top)) 22px max(44px,calc(env(safe-area-inset-bottom) + 30px));display:flex;flex-direction:column;gap:14px}
.bars{display:flex;gap:4px}.bars i{flex:1;height:5px;border-radius:9px;background:#0a0a0a2e;transition:.4s}.bars i.on{background:#0a0a0a}
.x{align-self:flex-end;background:#0a0a0a1f;border:0;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:grid;place-items:center;transition:.25s}
.em{width:84px;height:84px;border-radius:28px;background:#0a0a0a;color:#fff;display:grid;place-items:center;font-size:44px;flex:none;animation:pop .6s cubic-bezier(.2,1.8,.4,1),bob 3s ease-in-out .6s infinite}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}}@keyframes bob{50%{transform:translateY(-8px) rotate(-5deg)}}
.big{font-size:clamp(30px,9.5vw,46px)}.mid{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;justify-content:safe center;gap:14px;padding:4px 2px}
.nav{display:flex;gap:10px}.nav .btn:first-child{width:80px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{font:600 15px Outfit;padding:11px 15px;border-radius:99px;background:#ffffffd9;border:2px solid #0a0a0a;cursor:pointer;transition:transform .25s cubic-bezier(.2,1.6,.4,1),background .2s}
.chip.s{background:#0a0a0a;color:#fff;transform:scale(1.07) rotate(-2deg)}
.num{font:800 clamp(52px,17vw,80px) var(--hd);letter-spacing:-.05em}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:99px;background:#0a0a0a33;outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:38px;height:38px;border-radius:50%;background:#0a0a0a;border:5px solid #fff;box-shadow:0 5px 16px #0006;cursor:grab}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#0a0a0a;border:5px solid #fff}
.t5in .r{display:flex;align-items:center;gap:10px;margin-bottom:8px;animation:in .4s both}
.t5in .r b{width:34px;height:34px;border-radius:12px;background:#0a0a0a;color:#fff;display:grid;place-items:center;font:800 15px var(--hd);flex:none}
.story input.t{background:#fff;color:#0a0a0a;border-color:#0a0a0a;box-shadow:none}.t5in input.t{padding:11px 14px;font-size:17px;border-radius:14px}
.t5{list-style:none;display:flex;flex-direction:column;gap:8px;padding:0}
.t5 li{display:flex;gap:12px;align-items:center;background:#0a0a0a;color:#fff;border-radius:16px;padding:12px 14px;font:700 19px var(--hd);animation:slide .55s cubic-bezier(.2,1.4,.4,1) both}
.t5 li:first-child{font-size:26px;background:#fff;color:#0a0a0a;border:3px solid #0a0a0a}.t5 li b{opacity:.55;font-size:15px;min-width:16px}
@keyframes slide{from{opacity:0;transform:translateX(-40px) scale(.9)}}
.ans{font:800 clamp(38px,12vw,64px)/1 var(--hd);letter-spacing:-.04em;word-break:break-word;animation:slam .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes slam{from{opacity:0;transform:scale(2.4) rotate(6deg)}}
.you{background:#0a0a0a;color:#fff;border-radius:18px;padding:12px 16px;font-size:15px;align-self:flex-start;animation:in .8s}
.you.match{background:#fff;color:#0a0a0a;outline:3px solid #0a0a0a}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.toast{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);background:#fff;color:#0a0a0a;font:700 14px var(--hd);padding:14px 22px;border-radius:99px;z-index:70;animation:in .3s}
canvas{position:fixed;inset:0;pointer-events:none;z-index:65;width:100%;height:100%}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;background:#ffffff0f;border:1px solid #ffffff14;border-radius:18px;padding:14px 16px;transition:.25s}
.row b{font:700 15px var(--hd);text-align:right;max-width:58%}.sm{font-size:14px;color:#b5b5c3}
.spk{position:fixed;width:9px;height:9px;margin:-4px;border-radius:50%;pointer-events:none;z-index:60;animation:spk .7s cubic-bezier(.1,.8,.3,1) forwards}
@keyframes spk{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
.rip{position:fixed;width:20px;height:20px;margin:-10px;border-radius:50%;border:3px solid #fff;mix-blend-mode:difference;pointer-events:none;z-index:60;animation:rip .6s ease-out forwards}
@keyframes rip{to{transform:scale(7);opacity:0}}
.wm{position:fixed;left:0;right:0;bottom:max(8px,env(safe-area-inset-bottom));text-align:center;font:700 11px var(--hd);letter-spacing:.06em;color:#fff;mix-blend-mode:difference;opacity:.85;z-index:80;pointer-events:none}
@media(hover:hover){.tile:hover{transform:translateY(-5px) scale(1.02);box-shadow:0 22px 44px -14px #000}.tile:hover::after{transform:translateX(120%)}.tile:hover .ar{transform:translateX(5px)}
.btn:hover{transform:translateY(-3px);background-position:100% 0;box-shadow:0 18px 36px -12px #1ed760cc}.btn.w:hover,.btn.k:hover,.btn.gh:hover{box-shadow:0 16px 32px -12px #0009}.btn.gh:hover{background:#ffffff22}
.chip:hover{transform:translateY(-3px) rotate(-1.5deg);background:#fff}.x:hover{transform:rotate(90deg)}.row:hover{background:#ffffff1a;transform:translateX(4px)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style></head><body>
<div id="bg"></div><div id="app"></div><div class="wm">developed by clout</div><canvas id="cf"></canvas>
<script>
const COL=['#1ed760','#ff4fb6','#ffe14a','#ff7a1a','#3d8bff','#b79cff','#1ed760','#ff4fb6'];
const GR=['linear-gradient(155deg,#1ed760,#c4f56a)','linear-gradient(155deg,#ff4fb6,#ffa05a)','linear-gradient(155deg,#ffe14a,#ff9f45)','linear-gradient(155deg,#ff8a2a,#ff4f8a)','linear-gradient(155deg,#6fc0ff,#b79cff)','linear-gradient(155deg,#b79cff,#ff7ad9)','linear-gradient(155deg,#16e0a8,#6fc0ff)','linear-gradient(155deg,#ff7ad9,#c8a2ff)'];
const L=v=>Array.isArray(v)?v:(v==null||v===''?[]:[v]);
const GENRES=['Malawian Afro-pop','Malawian Gospel','Malawian Hip-Hop','Malawian Reggae','Malawian Traditional','Pop','Hip-Hop','Rap','Trap','Drill','R&B','Soul','Afrobeats','Afro-pop','Amapiano','Gqom','Bongo Flava','Gospel','Reggae','Dancehall','Rock','Metal','Punk','Alternative','Indie','Country','Jazz','Blues','Classical','Lo-fi','House','Afro-house','Electronic','EDM','Latin','Reggaeton','K-Pop','Folk','Other'];
const Q=[
{id:'artist',e:'microphone-2',t:'Your top 5 artists?',type:'top5',ph:'Artist'},
{id:'song',e:'flame',t:'Your top 5 songs?',type:'top5',ph:'Song'},
{id:'album',e:'disc',t:'Your top 5 albums?',type:'top5',ph:'Album'},
{id:'genre',e:'headphones',t:'Your top genre?',type:'pick',opts:GENRES},
{id:'minutes',e:'clock',t:'Minutes listened this year?',type:'num',min:1000,max:500000,step:500,def:30000,u:'min'},
{id:'plays',e:'repeat',t:'Times you played your #1 song?',type:'num',min:10,max:1500,step:10,def:200,u:'plays'},
{id:'age',e:'cake',t:'Your listening age?',type:'num',min:1,max:90,step:1,def:25,u:'yrs'},
{id:'persona',e:'planet',t:'Your listening personality?',type:'pick',opts:['Voyager','Replayer','Trailblazer','Vampire','Alchemist','Cyclops','Time Traveler','Fanclubber']}];
const A=document.getElementById('app'),$=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const me=()=>JSON.parse(localStorage.pf_me||'null');
const api=async(p,body,method)=>{const m=me();const r=await fetch('/api/'+p,{method:method||(body?'POST':'GET'),headers:{'content-type':'application/json',...(m?{'x-user':m.username,'x-token':m.token}:{})},body:body?JSON.stringify(body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(d.error||'fail'),{status:r.status});return d};
const buzz=n=>navigator.vibrate&&navigator.vibrate(n||12);
const toast=t=>{const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2200)};
const fmt=(q,v)=>q.type=='num'?Number(v).toLocaleString()+' '+q.u:q.type=='top5'?L(v).join(', '):v;
const same=(q,x,y)=>x==null||y==null?false:q.type=='num'?Math.abs(x-y)/Math.max(y,1)<.15:q.type=='top5'?L(x).filter(i=>L(y).map(norm).includes(norm(i))).length>=3:norm(x)==norm(y);
const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
function confetti(){const c=$('#cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const P=Array.from({length:140},()=>({x:innerWidth/2,y:innerHeight*.6,vx:(Math.random()-.5)*16,vy:-Math.random()*18-4,s:Math.random()*9+4,c:COL[Math.random()*6|0],r:Math.random()*6}));let f=0;(function t(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.5;p.r+=.2;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++f<110)requestAnimationFrame(t);else x.clearRect(0,0,c.width,c.height)})()}
let S={pred:null,actual:null,friends:[]};
const ref=new URLSearchParams(location.search).get('f');
async function load(){const m=me();const [p,f]=await Promise.all([api('profile?u='+m.username),api('friends')]);S.pred=p.pred;S.actual=p.actual;S.friends=f.friends}
function score(pr,ac){let t=0;Q.forEach(q=>{const a=pr?.answers?.[q.id],b=ac?.answers?.[q.id];if(a==null||b==null)return;if(q.type=='top5'){const x=L(a).map(norm),y=L(b).map(norm);x.forEach((v,i)=>{if(v)t+=y[i]==v?20:y.includes(v)?10:0})}else if(q.type=='num'){t+=Math.max(0,Math.round(100*(1-2*Math.abs(a-b)/Math.max(b,1))))}else t+=norm(a)==norm(b)?100:0});return t}
const shareUrl=()=>location.origin+'/?f='+me().username;
async function share(){const d={title:'Predictify',text:`I predicted my Spotify Wrapped. Think you can beat me? @${me().username} (Predictify, developed by clout)`,url:shareUrl()};try{if(navigator.share)await navigator.share(d);else{await navigator.clipboard.writeText(d.url);toast('Link copied')}}catch(e){}}

function landing(){let st=null,tm,nm='';
A.innerHTML=`<div class="screen" style="justify-content:center"><h1 class="logo">Predict<span>i</span>fy</h1>
<div class="mq"><div>${'<b>★</b>TOP ARTIST<b>★</b>TOP SONG<b>★</b>LISTENING AGE<b>★</b>MINUTES<b>★</b>GENRE'.repeat(4)}</div></div>
${ref?`<h2 style="font-size:22px"><span style="color:var(--g)">@${esc(ref)}</span> predicted their Wrapped. Now it's your turn.</h2>`:`<h2 style="font-size:22px">Guess your Wrapped before Spotify tells you. Then flex on your friends.</h2>`}
<input class="t" id="u" placeholder="your username" maxlength="16" autocapitalize="off" autocomplete="off"><div class="hint" id="h"></div>
<input class="t" id="p" type="password" placeholder="secret PIN (4+ characters)" maxlength="12" autocomplete="off" style="display:none">
<button class="btn" id="go">Let's go</button></div>`;
const h=$('#h'),pw=$('#p'),say=(t,c)=>{h.className='hint '+(c||'');h.textContent=t};
$('#u').oninput=e=>{st=null;pw.style.display='none';nm=e.target.value.trim();clearTimeout(tm);if(!nm){say('');return}say('checking…');
tm=setTimeout(async()=>{try{const r=await api('check?u='+encodeURIComponent(nm));
if(r.available){st='new';pw.style.display='';say('@'+nm+' is free. Set a PIN to claim it. You\'ll need it to log back in.','ok')}
else if(r.exists){st=r.hasPin?'back':'claim';pw.style.display='';say(r.hasPin?'Welcome back @'+nm+'. Enter your PIN to continue.':'@'+nm+' has no PIN yet. If it\'s yours, set a PIN to claim it.','ok')}
else say(r.reason||'try another','no')}catch(e){say('no connection','no')}},350)};
$('#go').onclick=async()=>{const pin=pw.value;const bad=el=>{el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),400);buzz(40)};
if(!st)return bad($('#u'));if(pin.length<4){say('PIN needs at least 4 characters','no');return bad(pw)}
try{const r=await api(st=='new'?'register':'login',{username:nm,pin});localStorage.pf_me=JSON.stringify(r);confetti();buzz([20,40,20]);boot(true)}
catch(e){say(e.status==401?'Wrong PIN. Try again.':e.status==409?'Someone just took that, try another':'something broke: '+e.message,'no');bad(pw)}}}

async function boot(fresh){const m=me();if(!m)return landing();
try{if(ref&&ref.toLowerCase()!=m.username.toLowerCase()){await api('befriend',{friend:ref}).catch(()=>{});history.replaceState(null,'','/');await load();const f=S.friends.find(x=>x.username.toLowerCase()==ref.toLowerCase());return f?view(f):home()}
await load();fresh&&!S.pred?play('pred'):home()}catch(e){if(e.status==401){localStorage.removeItem('pf_me');landing()}else A.innerHTML='<div class="screen"><h2>Can\'t connect</h2><button class="btn" onclick="boot()">Retry</button></div>'}}

function home(){const m=me(),done=!!S.pred;
const fr=S.friends.map((f,i)=>`<div class="tile" data-i="${i}" style="background:${GR[(i+2)%8]};animation-delay:${i*70}ms"><div class="av">${esc(f.username[0].toUpperCase())}</div><div style="flex:1"><h3>@${esc(f.username)}</h3><small>${f.pred?'tap to see their predictions':'still thinking…'}</small></div>${S.actual&&f.actual&&f.pred?`<b class="d">${score(f.pred,f.actual)}</b>`:'<i class="ti ti-chevron-right ar"></i>'}</div>`).join('');
A.innerHTML=`<div class="screen"><div class="sm">logged in as</div><h1 style="font-size:40px;margin-top:-10px">@${esc(m.username)}</h1>
<div class="tile" id="pl" style="background:var(--gg)"><div class="ic"><i class="ti ti-${done?'pencil':'sparkles'}"></i></div><div style="flex:1"><h3>${done?'Edit my predictions':'Make my predictions'}</h3><small>${done?'locked in. tweak until Wrapped drops':'8 quick questions'}</small></div><i class="ti ti-chevron-right ar"></i></div>
${done?`<button class="btn w" id="sh"><i class="ti ti-share-3"></i> Share with friends</button><h2 style="font-size:20px;margin-top:6px">My picks</h2>${Q.map(q=>`<div class="row"><span class="sm"><i class="ti ti-${q.e}"></i> ${q.t}</span><b style="font-size:15px;text-align:right">${esc(fmt(q,S.pred.answers[q.id]))}</b></div>`).join('')}`:`<div class="row sm">You haven't picked your predictions yet. Tap the green card to start.</div>`}
<h2 style="font-size:20px;margin-top:10px">Friends ${S.friends.length?'('+S.friends.length+')':''}</h2>${fr||'<div class="row sm">No friends yet. Share your link and they\'ll show up here when they join.</div>'}
<div class="tile" id="rv" style="background:var(--gv);color:#fff;margin-top:10px"><div class="ic"><i class="ti ti-gift"></i></div><div style="flex:1"><h3>Wrapped is out</h3><small>${S.actual?'see the scoreboard':'enter your real results and compare'}</small></div><i class="ti ti-chevron-right ar"></i></div></div>`;
$('.screen').insertAdjacentHTML('beforeend','<button class="btn gh" id="lo">Switch account</button>');$('#lo').onclick=()=>{localStorage.removeItem('pf_me');landing()};$('#pl').onclick=()=>play('pred');$('#rv').onclick=()=>S.actual?board():play('actual');if($('#sh'))$('#sh').onclick=share;
A.querySelectorAll('[data-i]').forEach(e=>e.onclick=()=>{const f=S.friends[e.dataset.i];f.pred?view(f):toast('They haven\'t predicted yet')})}

function play(mode){let i=0;const a={...((mode=='pred'?S.pred:S.actual)?.answers||{})};
const draw=()=>{const q=Q[i],c=GR[i];let inp='';
if(q.type=='text')inp=`<input class="t" id="in" placeholder="${q.ph}" value="${esc(a[q.id]||'')}" autocomplete="off">`;
if(q.type=='top5'){const v=L(a[q.id]);inp=`<div class="t5in">${[0,1,2,3,4].map(k=>`<div class="r" style="animation-delay:${k*60}ms"><b>${k+1}</b><input class="t" data-k="${k}" placeholder="${q.ph} #${k+1}" value="${esc(v[k]||'')}" autocomplete="off"></div>`).join('')}</div>`}
if(q.type=='pick')inp=`<div class="chips">${q.opts.map(o=>`<div class="chip ${a[q.id]==o?'s':''}" data-o="${o}">${o}</div>`).join('')}</div>`;
if(q.type=='num'){const v=a[q.id]??q.def;a[q.id]=v;inp=`<div class="num" id="nv">${v.toLocaleString()}</div><div class="sm" style="color:#000a">${q.u}</div><input type="range" id="rg" min="${q.min}" max="${q.max}" step="${q.step}" value="${v}">`}
A.innerHTML=`<div class="story" style="background:${c}"><div class="in"><div class="bars">${Q.map((_,k)=>`<i class="${k<=i?'on':''}"></i>`).join('')}</div><button class="x" id="x"><i class="ti ti-x"></i></button>
<div class="mid"><div class="em"><i class="ti ti-${q.e}"></i></div><div style="font-weight:700">${mode=='pred'?'Predict':'What really happened'}</div><h2 class="big">${q.t}</h2>${inp}</div>
<div class="nav"><button class="btn w" id="bk"><i class="ti ti-arrow-left"></i></button><button class="btn k" id="nx">${i==Q.length-1?'Lock it in':'Next'}</button></div></div></div>`;
$('#x').onclick=home;$('#bk').onclick=()=>{if(i){i--;draw()}else home()};
if(q.type=='text')$('#in').oninput=e=>a[q.id]=e.target.value.trim();
if(q.type=='top5')A.querySelectorAll('.t5in input').forEach(e=>e.oninput=()=>{const v=[0,1,2,3,4].map(k=>L(a[q.id])[k]||'');v[e.dataset.k]=e.value.trim();a[q.id]=v});
if(q.type=='pick')A.querySelectorAll('.chip').forEach(e=>e.onclick=()=>{a[q.id]=e.dataset.o;buzz();A.querySelectorAll('.chip').forEach(x=>x.classList.toggle('s',x==e))});
if(q.type=='num')$('#rg').oninput=e=>{a[q.id]=+e.target.value;$('#nv').textContent=(+e.target.value).toLocaleString();buzz(4)};
$('#nx').onclick=async()=>{if(q.type=='top5')a[q.id]=[...A.querySelectorAll('.t5in input')].map(x=>x.value.trim());if(q.type=='top5'?L(a[q.id]).filter(Boolean).length<5:!a[q.id]){if(q.type=='top5')toast('Fill all 5 spots');const t=$('.mid');t.classList.add('shake');setTimeout(()=>t.classList.remove('shake'),400);buzz(40);return}
if(i<Q.length-1){i++;buzz();return draw()}
$('#nx').textContent='Saving…';try{await api(mode=='pred'?'predictions':'actuals',{answers:a},'PUT');await load();confetti();buzz([30,50,30]);mode=='pred'?done():board()}catch(e){toast('Save failed, try again');$('#nx').textContent='Lock it in'}}};draw()}

function done(){A.innerHTML=`<div class="screen" style="justify-content:center;text-align:center"><div class="em" style="margin:0 auto"><i class="ti ti-lock"></i></div><h1 style="font-size:40px">Locked in.</h1><div class="sm">Now send it to your friends. They'll flip through your picks.</div><button class="btn" id="sh"><i class="ti ti-share-3"></i> Share my link</button><button class="btn gh" id="hm">Back home</button></div>`;$('#sh').onclick=share;$('#hm').onclick=home}

function view(f){let i=0;const N=Q.length+2,mine=S.pred?.answers||{},fa=f.pred.answers;
let twin=0;Q.forEach(q=>{if(same(q,mine[q.id],fa[q.id]))twin++});
const draw=()=>{let c=GR[i%8],body;
if(i==0)body=`<div class="mid"><div class="em"><i class="ti ti-eye"></i></div><div style="font-weight:700">Wrapped prediction by</div><h2 class="big">@${esc(f.username)}</h2><div>Tap to see what they think they'll get.</div></div>`;
else if(i<=Q.length){const q=Q[i-1],v=fa[q.id],y=mine[q.id],m=same(q,y,v);
body=`<div class="mid"><div class="em"><i class="ti ti-${q.e}"></i></div><div style="font-weight:700">${q.t}</div>${q.type=='top5'?`<ol class="t5">${L(v).map((x,k)=>`<li style="animation-delay:${k*120}ms"><b>${k+1}</b>${esc(x)}</li>`).join('')}</ol>`:`<div class="ans">${esc(fmt(q,v))}</div>`}${y!=null?`<div class="you ${m?'match':''}">${m?(q.type=='top5'?'3+ of your picks overlap. Twins.':'You picked the same. Twins.'):'You said '+esc(fmt(q,y))}</div>`:''}</div>`}
else body=`<div class="mid"><div class="em"><i class="ti ti-${twin>=5?'heart-handshake':twin>=3?'users':'swords'}"></i></div><h2 class="big">${S.pred?`${twin}/${Q.length} matches`:'Your turn'}</h2><div>${S.pred?(twin>=5?'You two are basically the same person.':twin>=3?'Good taste overlap.':'Wildly different. Wrapped day will be fun.'):'Make your own predictions so you can face off.'}</div></div>`;
A.innerHTML=`<div class="story" style="background:${c}"><div class="in"><div class="bars">${Array.from({length:N},(_,k)=>`<i class="${k<=i?'on':''}"></i>`).join('')}</div><button class="x" id="x"><i class="ti ti-x"></i></button>${body}<div class="nav"><button class="btn w" id="bk"><i class="ti ti-arrow-left"></i></button><button class="btn k" id="nx">${i==N-1?(S.pred?'Back home':'Make mine'):'Next'}</button></div></div></div>`;
$('#x').onclick=home;$('#bk').onclick=()=>{if(i){i--;draw()}else home()};
$('#nx').onclick=()=>{if(i<N-1){i++;buzz();draw()}else{i==N-1&&twin>=5&&confetti();S.pred?home():play('pred')}};if(i==N-1&&twin>=5)confetti()};draw()}

function board(){const m=me();const all=[{u:m.username,p:S.pred,a:S.actual,me:1},...S.friends.map(f=>({u:f.username,p:f.pred,a:f.actual}))].filter(x=>x.p&&x.a).map(x=>({...x,s:score(x.p,x.a)})).sort((a,b)=>b.s-a.s);
A.innerHTML=`<div class="screen"><h1 style="font-size:36px"><i class="ti ti-trophy"></i> Scoreboard</h1><div class="sm">100 points per question. Numbers score by how close you were.</div>
${all.map((x,i)=>`<div class="tile" style="background:${i?'#161616':'var(--gg)'};color:${i?'#fff':'#000'};animation-delay:${i*90}ms"><b class="d" style="font-size:26px">${i?i+1:'<i class="ti ti-trophy"></i>'}</b><div style="flex:1"><h3>@${esc(x.u)}${x.me?' (you)':''}</h3></div><b class="d">${x.s}</b></div>`).join('')||'<div class="row sm">Nobody has entered their real results yet.</div>'}
<button class="btn w" id="re">Redo my real results</button><button class="btn gh" id="hm">Back home</button></div>`;
if(all[0]?.me)confetti();$('#re').onclick=()=>play('actual');$('#hm').onclick=home}
(()=>{const b=$('#bg');b.innerHTML='<div class="au" style="width:380px;height:380px;background:#7b3ff2;top:-120px;left:-120px"></div><div class="au" style="width:340px;height:340px;background:#ff4fb6;bottom:-100px;right:-100px;animation-delay:-5s"></div><div class="au" style="width:260px;height:260px;background:#1ed760;top:45%;left:30%;opacity:.22;animation-delay:-9s"></div><div class="vin"></div>';
const I=['music','disc','headphones','microphone-2','star','heart','flame','playlist'];
for(let i=0;i<16;i++){const e=document.createElement('i');e.className='ti ti-'+I[i%8]+' fl';e.style.cssText=`left:${Math.random()*95}%;font-size:${18+Math.random()*30}px;animation-duration:${14+Math.random()*16}s;animation-delay:-${Math.random()*25}s;color:${COL[i%6]}`;b.append(e)}
addEventListener('pointermove',e=>{b.style.setProperty('--mx',e.clientX/innerWidth-.5);b.style.setProperty('--my',e.clientY/innerHeight-.5)})})();
document.addEventListener('pointerdown',e=>{const x=e.clientX,y=e.clientY,r=document.createElement('div');r.className='rip';r.style.cssText=`left:${x}px;top:${y}px`;document.body.append(r);setTimeout(()=>r.remove(),650);
for(let i=0;i<12;i++){const s=document.createElement('span'),a=Math.PI*2*i/12+Math.random()*.5,d=44+Math.random()*56;s.className='spk';s.style.cssText=`left:${x}px;top:${y}px;background:${COL[i%6]};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px`;document.body.append(s);setTimeout(()=>s.remove(),750)}});
console.log("%cPredictify | developed by clout","font:900 16px sans-serif;color:#1ed760");
boot();
</script></body></html>
